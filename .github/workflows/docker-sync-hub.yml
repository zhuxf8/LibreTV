name: docker-sync-hub

# 镜像标签对齐/补救工具：以 GHCR 上某个版本 tag 的 digest 为源，
# 把「主.次」与 latest 标签在 GHCR 与 Docker Hub 两侧补齐并校验一致。
# 不重新构建，纯 registry 元数据操作，几秒完成。
# 用途：
# - 主流程 merge 打标签不完整时的补救（如 v2.12.5/v2.12.6 只打上了版本号 tag）；
# - 两个 registry 标签不一致时的手动对齐。
# 在 Actions 页面手动触发，输入版本号（如 2.12.6，兼容 v 前缀）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要对齐的版本号（如 2.12.6），将以该版本的 digest 为源补齐 主.次 与 latest'
        required: true
        default: ''

permissions:
  packages: write

env:
  GHCR_IMAGE: ghcr.io/librespark/libretv
  DOCKERHUB_IMAGE: docker.io/bestzwei/libretv

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      # 源镜像为公开包，此登录主要为 GHCR 写标签授权
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 以版本 digest 为源补齐两个 registry 的标签
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 主.次.修订（如 2.12.6），收到：${version}"
            exit 1
          fi
          minor="${version%.*}"
          digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::GHCR 上不存在 ${GHCR_IMAGE}:${version}"
            exit 1
          fi
          echo "源：${GHCR_IMAGE}:${version} @ ${digest}"
          echo "补齐标签：GHCR[${minor} latest] / Docker Hub[${version} ${minor} latest]"
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${minor}" \
            -t "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}@${digest}"
          docker buildx imagetools create \
            -t "${DOCKERHUB_IMAGE}:${version}" \
            -t "${DOCKERHUB_IMAGE}:${minor}" \
            -t "${DOCKERHUB_IMAGE}:latest" \
            "${GHCR_IMAGE}@${digest}"

      - name: 校验两侧全部标签 digest 一致
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          minor="${version%.*}"
          src=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          fail=0
          check() {
            local registry=$1 repo=$2 tag=$3
            local got
            got=$(docker buildx imagetools inspect "${registry}/${repo}:${tag}" --format '{{.Manifest.Digest}}')
            if [ "$got" = "$src" ]; then
              echo "OK  ${registry}/${repo}:${tag} @ ${got}"
            else
              echo "FAIL ${registry}/${repo}:${tag} @ ${got}（期望 ${src}）"
              fail=1
            fi
          }
          check ghcr.io librespark/libretv "$version"
          check ghcr.io librespark/libretv "$minor"
          check ghcr.io librespark/libretv latest
          check registry-1.docker.io bestzwei/libretv "$version"
          check registry-1.docker.io bestzwei/libretv "$minor"
          check registry-1.docker.io bestzwei/libretv latest
          exit $fail
