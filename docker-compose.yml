services:
  libretv:
    build: .
    container_name: libretv-next
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填：访问密码
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      # 可选：会话/代理签名密钥（多实例部署建议显式设置）
      # - PROXY_SECRET=your-secret
      # - REQUEST_TIMEOUT=8000
      # - MAX_RETRIES=1
      # - DEBUG=false
